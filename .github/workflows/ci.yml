name: ci
on:
  push:
    branches: ["*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: unitsml/unitsml-testsuite
          path: unitsml-testsuite
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm run replay
        env:
          CORPUS_DIR: ${{ github.workspace }}/unitsml-testsuite/corpora/renders
